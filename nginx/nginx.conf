events {}

http {
  upstream backend {
    server api-gateway:8080;  # NGINX uses the Docker service name to resolve the backend container
  }

  server {
    listen 80;

    # Route for API requests
    location /api/ {
      proxy_pass http://backend;  # Forward traffic to the backend defined in the upstream section
      proxy_set_header Host $host; # Pass the original Host header
      proxy_set_header X-Real-IP $remote_addr; # Pass the real IP
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default route for serving index.html or other static files
    location / {
      root /usr/share/nginx/html;  # Default NGINX root directory
      index index.html;            # Serve index.html as the default file
    }

  }
}
